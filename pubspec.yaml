publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  image_picker: ^1.2.4
  latlong2: ^0.10.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
